<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Remote Mouse logo — the ONE master artwork.
    Every icon (Windows .exe + tray, phone web app, Android app) is rendered
    from this file by pc/tools/render_icons.py, so they always match.

    Structure (render_icons.py relies on these ids):
      #bg   the rounded-square gradient background
      #art  the mouse + wireless arcs (drawn on top)
  -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C7DFF"/>
      <stop offset="1" stop-color="#7A4DFF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="detail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C7DFF"/>
      <stop offset="1" stop-color="#7A4DFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B1150" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="bg">
    <rect width="1024" height="1024" rx="232" fill="url(#grad)"/>
    <rect width="1024" height="1024" rx="232" fill="url(#gloss)"/>
  </g>

  <g id="art">
    <!-- wireless arcs: "this mouse talks over the air" -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="46">
      <path d="M434.2 302.2 A110 110 0 0 1 589.8 302.2" stroke-opacity="0.95"/>
      <path d="M377.6 245.6 A190 190 0 0 1 646.4 245.6" stroke-opacity="0.6"/>
    </g>
    <!-- mouse body -->
    <g filter="url(#shadow)">
      <rect x="362" y="392" width="300" height="440" rx="150" fill="#FFFFFF"/>
    </g>
    <!-- button split + scroll wheel -->
    <!-- solid colour: a gradient on a perfectly vertical line has zero width and won't draw -->
    <line x1="512" y1="392" x2="512" y2="540" stroke="#6A63FF" stroke-width="12" stroke-linecap="round"/>
    <rect x="490" y="440" width="44" height="88" rx="22" fill="url(#detail)"/>
  </g>
</svg>
